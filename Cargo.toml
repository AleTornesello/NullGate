[workspace]
resolver = "3"
members = [
    "crates/nullgate",
    "crates/nullgate-core",
    "crates/nullgate-dns",
    "crates/nullgate-http",
    "crates/nullgate-orchestrator",
    "crates/nullgate-web",
]
default-members = ["crates/nullgate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
nullgate-core = { path = "crates/nullgate-core" }
nullgate-dns = { path = "crates/nullgate-dns" }
nullgate-http = { path = "crates/nullgate-http" }
nullgate-orchestrator = { path = "crates/nullgate-orchestrator" }
nullgate-web = { path = "crates/nullgate-web" }

# Task 1 selections; activate in owning crates with workspace = true.
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
hickory-proto = { version = "=0.26.3" }
hyper = { version = "=1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "server-auto", "tokio"] }
http-body-util = { version = "=0.1.5" }
rustls = { version = "=0.23.46" }
tokio-rustls = { version = "=0.26.6" }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
axum = { version = "=0.8.9" }
maud = { version = "=0.27.0" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
toml = { version = "=1.2.1" }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
idna = { version = "=1.1.0" }
reqwest = { version = "=0.13.5", features = ["rustls", "stream"], default-features = false }
argon2 = { version = "=0.6.0" }
openidconnect = { version = "=4.1.0", default-features = false }

serde_path_to_error = "=0.1.20"

httparse = "=1.10.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
